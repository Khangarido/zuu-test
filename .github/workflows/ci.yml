# Checks every pull request before it can be merged: unit tests and a full production build.
# (Lint is not a gate yet: the existing code has two react-hooks lint errors in the exam screen.)
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.example.test
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://example.test
        run: npm run build
