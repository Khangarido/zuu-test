# zuutest.site — ADDITIONAL server blocks for an existing nginx that already
# serves muur.site. Add as a NEW file; do not edit muur.site's config.
#
# Install (host nginx, Debian/Ubuntu layout):
#   1. sudo cp nginx-zuutest.conf /etc/nginx/sites-available/zuutest.conf
#      sudo ln -s /etc/nginx/sites-available/zuutest.conf /etc/nginx/sites-enabled/
#      (RHEL-style layout: copy to /etc/nginx/conf.d/zuutest.conf instead)
#   2. sudo nginx -t                      # must pass BEFORE reloading
#   3. sudo systemctl reload nginx        # graceful, muur.site keeps serving
#   4. TLS, once DNS A records point here (certbot edits ONLY these server blocks):
#        sudo certbot --nginx -d next.zuutest.site -d supabase.zuutest.site
#      At cutover:  sudo certbot --nginx -d zuutest.site -d www.zuutest.site
#
# nginx in Docker (e.g. nginx-proxy-manager): same locations, but proxy_pass to
# http://zuu-app:3000 and http://supabase-envoy:8000 over the shared network
# (deploy/docker-compose.app.edge.yml, deploy/supabase/docker-compose.edge.yml).
#
# Upstream ports match deploy/.env APP_PORT (3100) and supabase .env API_GW_HTTP_PORT (8100).
# Variable names are prefixed zuu_ so they cannot collide with muur.site's config.

# WebSocket upgrade for Supabase Realtime.
map $http_upgrade $zuu_connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Staging / rehearsal host (remove after cutover) ──────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name next.zuutest.site;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Streaming/Suspense: don't buffer (Next.js self-hosting guide; the app
        # also sends X-Accel-Buffering: no).
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

# ── Supabase API host: only the four endpoints the app uses are public ───────
server {
    listen 80;
    listen [::]:80;
    server_name supabase.zuutest.site;

    # Storage uploads are capped at 50 MB by Supabase (FILE_SIZE_LIMIT).
    client_max_body_size 55m;

    location ~ ^/(auth/v1|rest/v1|realtime/v1|storage/v1)/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Realtime WebSockets
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $zuu_connection_upgrade;
        proxy_buffering off;
        # Keep idle sockets open; the Realtime client sends heartbeats every ~25s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}

